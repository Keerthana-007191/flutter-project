name: Build Web App

on:
  workflow_dispatch:

jobs:
  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find the Flutter project folder
        id: proj
        run: echo "dir=$(dirname "$(find . -name pubspec.yaml -not -path './.git/*' | head -n 1)")" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Add web platform files
        working-directory: ${{ steps.proj.outputs.dir }}
        run: |
          cp lib/main.dart /tmp/main.dart
          cp pubspec.yaml /tmp/pubspec.yaml
          flutter create --platforms=web --project-name doctor_appointments --org com.lab .
          cp /tmp/main.dart lib/main.dart
          cp /tmp/pubspec.yaml pubspec.yaml

      - name: Build web app
        working-directory: ${{ steps.proj.outputs.dir }}
        run: flutter build web --release

      - uses: actions/upload-artifact@v4
        with:
          name: doctor-appointments-web
          path: ${{ steps.proj.outputs.dir }}/build/web
